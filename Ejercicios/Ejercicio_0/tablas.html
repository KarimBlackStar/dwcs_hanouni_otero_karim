<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablas de multiplicar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    table {
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    caption {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 5px;
    }

    td {
      border: 1px solid #ccc;
      padding: 5px 10px;
    }
  </style>
</head>
<body>

  <h1>Tablas de multiplicar</h1>

  <table>
    <caption>Tabla del 1</caption>
    <tr><td>1 × 1 = 1</td></tr>
    <tr><td>1 × 2 = 2</td></tr>
    <tr><td>1 × 3 = 3</td></tr>
    <tr><td>1 × 4 = 4</td></tr>
    <tr><td>1 × 5 = 5</td></tr>
    <tr><td>1 × 6 = 6</td></tr>
    <tr><td>1 × 7 = 7</td></tr>
    <tr><td>1 × 8 = 8</td></tr>
    <tr><td>1 × 9 = 9</td></tr>
    <tr><td>1 × 10 = 10</td></tr>
  </table>

  <table>
    <caption>Tabla del 2</caption>
    <tr><td>2 × 1 = 2</td></tr>
    <tr><td>2 × 2 = 4</td></tr>
    <tr><td>2 × 3 = 6</td></tr>
    <tr><td>2 × 4 = 8</td></tr>
    <tr><td>2 × 5 = 10</td></tr>
    <tr><td>2 × 6 = 12</td></tr>
    <tr><td>2 × 7 = 14</td></tr>
    <tr><td>2 × 8 = 16</td></tr>
    <tr><td>2 × 9 = 18</td></tr>
    <tr><td>2 × 10 = 20</td></tr>
  </table>
<!-- Resto de las tablas... -->

</body>
</html>
